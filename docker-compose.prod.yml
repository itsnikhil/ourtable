# Production / LAN host stack (HLD §7).
# Deploy (migrations run automatically before app/worker):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Keep a real `.env` on the host (never commit it). AUTH_BYPASS must be false.
# Prefer a URL-safe POSTGRES_PASSWORD (or set a full DATABASE_URL in .env) —
# characters like /, +, = in the password break compose URL interpolation.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ourtable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ourtable}
      POSTGRES_DB: ${POSTGRES_DB:-ourtable}
    # LAN-only: bind Postgres to localhost on the host so it isn't open on the LAN.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ourtable} -d ${POSTGRES_DB:-ourtable}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: apply pending Drizzle SQL migrations, then exit 0.
  migrate:
    build:
      context: .
      target: migrate
    env_file:
      - .env
    environment:
      # Built from POSTGRES_* so the hostname is always the compose service `db`.
      # Use a URL-safe POSTGRES_PASSWORD (avoid /, +, =) or this URL breaks.
      DATABASE_URL: postgresql://${POSTGRES_USER:-ourtable}:${POSTGRES_PASSWORD:-ourtable}@db:5432/${POSTGRES_DB:-ourtable}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ourtable}:${POSTGRES_PASSWORD:-ourtable}@db:5432/${POSTGRES_DB:-ourtable}
      AUTH_BYPASS: "false"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    env_file:
      - .env
    environment:
      APP_URL: http://app:3000
      # Hard-coded quotes (YAML); do NOT use ${VAR:-"0 * * * *"} — Compose
      # keeps the quotes inside the value and node-cron rejects them.
      CRON_COMPLETE_PLANNED: "0 * * * *"
      CRON_CLEANUP_ORPHAN_PHOTOS: "0 4 * * *"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
